name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install

          mkdir hf-sync
          git archive HEAD | tar -x -C hf-sync

          cd hf-sync
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git lfs track "*.pt" "*.pth" "*.bin" "*.safetensors" "*.keras" "*.h5" "*.pkl" "glove*.txt" "model training/data/glove*.txt" "[0-9]" "best_sentiment_bigru/data/*"
          git add .gitattributes
          git add .
          git commit -m "Sync Space files"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/CJY0129/cinema-sentiment-analysis"
          git push hf main --force
